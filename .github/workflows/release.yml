name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    env:
      APP_NAME: streamsaver
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pip patchelf desktop-file-utils squashfs-tools
          python3 -m pip install --user PyInstaller PyQt6

      - name: Build Debian package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_root="package/DEBIAN"
          install_root="package/usr"
          mkdir -p "$package_root" "$install_root/bin" "$install_root/lib/streamsaver" \
            "$install_root/share/applications" "$install_root/share/icons/hicolor/scalable/apps"
          cp main.py downloader.py "$install_root/lib/streamsaver/"
          install -m 755 packaging/streamsaver.desktop "$install_root/share/applications/streamsaver.desktop"
          install -m 644 streamsaver.svg "$install_root/share/icons/hicolor/scalable/apps/streamsaver.svg"
          printf '%s\n' '#!/usr/bin/env sh' 'exec python3 /usr/lib/streamsaver/main.py "$@"' > "$install_root/bin/streamsaver"
          chmod 755 "$install_root/bin/streamsaver"
          cat > "$package_root/control" <<EOF
          Package: streamsaver
          Version: $version
          Section: video
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.10), python3-pyqt6, yt-dlp, ffmpeg
          Maintainer: Mads Nørgaard <madds.noergaard@gmail.com>
          Description: Desktop app for downloading online video and audio
           StreamSaver downloads a single video as MP4 or extracts high-quality MP3.
          EOF
          dpkg-deb --build --root-owner-group package "streamsaver_${version}_all.deb"

      - name: Build portable executable
        run: |
          python3 -m PyInstaller --noconfirm --clean --onefile --name StreamSaver \
            --collect-all PyQt6 main.py

      - name: Assemble AppImage directory
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps
          install -m 755 dist/StreamSaver AppDir/usr/bin/StreamSaver
          install -m 644 packaging/streamsaver.desktop AppDir/usr/share/applications/streamsaver.desktop
          install -m 644 streamsaver.svg AppDir/usr/share/icons/hicolor/scalable/apps/streamsaver.svg
          install -m 644 packaging/streamsaver.desktop AppDir/streamsaver.desktop
          install -m 644 streamsaver.svg AppDir/streamsaver.svg
          curl -fL --retry 3 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o AppDir/usr/bin/yt-dlp
          chmod 755 AppDir/usr/bin/yt-dlp
          curl -fL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            -o ffmpeg.tar.xz
          tar -xJf ffmpeg.tar.xz --wildcards --strip-components=1 -C AppDir/usr/bin \
            '*/ffmpeg' '*/ffprobe'
          chmod 755 AppDir/usr/bin/ffmpeg AppDir/usr/bin/ffprobe
          cat > AppDir/AppRun <<'EOF'
          #!/usr/bin/env sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/StreamSaver" "$@"
          EOF
          chmod 755 AppDir/AppRun

      - name: Package AppImage
        run: |
          curl -fL --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage
          chmod 755 appimagetool.AppImage
          ARCH=x86_64 VERSION="${GITHUB_REF_NAME#v}" ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "StreamSaver-${GITHUB_REF_NAME}-x86_64.AppImage"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "StreamSaver $GITHUB_REF_NAME" \
            --generate-notes \
            "streamsaver_${GITHUB_REF_NAME#v}_all.deb" \
            "StreamSaver-${GITHUB_REF_NAME}-x86_64.AppImage"
